name: Factory worker

on:
  schedule:
    # Safety net if Vercel dispatch is not configured (06:30 UTC daily)
    - cron: "30 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [factory-generate]

concurrency:
  group: factory-worker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_GIT_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "factory-worker"
          git config user.email "factory-worker@users.noreply.github.com"

      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$DATABASE_URL" ] || [ -n "$POSTGRES_URL" ]; then
            echo "database=set"
          else
            echo "database=MISSING"
            echo "::error::Add DATABASE_URL (or POSTGRES_URL) as a repository secret — same Neon URL as Vercel Production."
            exit 1
          fi
          for name in GOOGLE_PLACES_API_KEY; do
            eval "value=\${$name}"
            if [ -n "$value" ]; then
              echo "$name=set"
            else
              echo "$name=MISSING"
              echo "::error::$name repository secret is required for lead discovery."
              exit 1
            fi
          done
          if [ -n "$OPENAI_API_KEY" ] || [ -n "$GEMINI_API_KEY" ]; then
            echo "ai_key=set"
          else
            echo "ai_key=MISSING"
            echo "::error::Add OPENAI_API_KEY or GEMINI_API_KEY as a repository secret."
            exit 1
          fi

      - name: Run factory worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.POSTGRES_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          SMS_LEAD_TARGET: ${{ vars.SMS_LEAD_TARGET }}
          SMS_LEAD_REPLENISH_BATCH: ${{ vars.SMS_LEAD_REPLENISH_BATCH }}
          FACTORY_WORKER_ENABLED: "true"
          FACTORY_PUBLISH_ENABLED: "true"
          FACTORY_GIT_BRANCH: ${{ github.ref_name }}
          FACTORY_TRIGGER_SOURCE: ${{ github.event_name }}
          FACTORY_WORKER_LEASE_MINUTES: ${{ vars.FACTORY_WORKER_LEASE_MINUTES }}
          FACTORY_WORKER_COOLDOWN_MINUTES: ${{ vars.FACTORY_WORKER_COOLDOWN_MINUTES }}
          FACTORY_WORKER_MAX_CONSECUTIVE_FAILURES: ${{ vars.FACTORY_WORKER_MAX_CONSECUTIVE_FAILURES }}
        run: npm run factory-worker
