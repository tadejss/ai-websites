name: Customer publish

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Customer slug to publish
        required: true
        type: string
  repository_dispatch:
    types: [customer-publish]

concurrency:
  group: customer-publish-${{ github.event.client_payload.slug || inputs.slug }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_GIT_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "customer-publish"
          git config user.email "customer-publish@users.noreply.github.com"

      - name: Resolve and validate slug
        id: slug
        env:
          CLIENT_PAYLOAD_SLUG: ${{ github.event.client_payload.slug }}
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          SLUG="${CLIENT_PAYLOAD_SLUG:-${INPUT_SLUG:-}}"
          # Exact application slug format — reject anything else (no silent normalize).
          if ! printf '%s' "$SLUG" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "Invalid customer slug (rejected)." >&2
            exit 1
          fi
          if [ "${#SLUG}" -gt 64 ]; then
            echo "Invalid customer slug (too long)." >&2
            exit 1
          fi
          # Safe GITHUB_OUTPUT write: validated charset only, via printf.
          printf 'value=%s\n' "$SLUG" >> "$GITHUB_OUTPUT"

      - name: Publish customer site
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.POSTGRES_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          FACTORY_PUBLISH_ENABLED: "true"
          FACTORY_GIT_BRANCH: ${{ github.ref_name }}
          FACTORY_WORKER_ID: gha-customer-publish
          CUSTOMER_SLUG: ${{ steps.slug.outputs.value }}
        run: npm run publish-customer -- "$CUSTOMER_SLUG"
